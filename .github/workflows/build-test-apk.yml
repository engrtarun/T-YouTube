name: Build T YouTube test APK

# Heavy work (apktool decode/rebuild, signing) runs on GitHub's runners.
# Trigger: push a tag named test-zversion-* or test-v* (creates a prerelease
# with the APK), or run this workflow manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    tags:
      - "test-zversion-*"
      - "test-v*"

permissions:
  contents: write

concurrency:
  group: build-zversion-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_APK_URL: https://github.com/engrtarun/T-YouTube/releases/download/v1.0.1/T-YouTube-v1.0.1.apk
  BASE_APK_SHA256: 71b0f782702129a0ddcc80ee0a7150f52fe0099671ab62692766b1c605ebe7fe
  APKTOOL_VERSION: 2.11.1
  CERT_SHA256: a40da80a59d170caa950cf15c18c454d47a39b26989d8b640ecd745ba71bf5dc
  MICROG_VERSION: 7.3.0
  MICROG_CERT_SHA256: 0b6c9515afb195fac59601696ba0a7907a0b217ccf720b43148427ccf64343e7
  MICROG_ARM64_SHA256: 98e2de8c1543fb2736971b8ba307c2b58c092c96fb6dcebe3c3b8a4538151a23
  MICROG_V7_SHA256: af89d740a58136779f7406b6f00a546880ee7f3c7472b2a886239ee5a6e43a86

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download stable v1.0.1 and verify checksum
        run: |
          curl -fL --retry 3 --retry-delay 5 -o base.apk "$BASE_APK_URL"
          echo "$BASE_APK_SHA256  base.apk" | sha256sum -c -

      - name: Download apktool ${{ env.APKTOOL_VERSION }}
        run: |
          curl -fL --retry 3 -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

      - name: Download official MicroG-RE ${{ env.MICROG_VERSION }} assets
        run: |
          mkdir -p microg-assets
          BASE="https://github.com/MorpheApp/MicroG-RE/releases/download/${MICROG_VERSION}"
          curl -fL --retry 3 --retry-delay 5 -o "microg-assets/microg-${MICROG_VERSION}-noicon-arm64-v8a.apk" \
            "$BASE/microg-${MICROG_VERSION}-noicon-arm64-v8a.apk"
          curl -fL --retry 3 --retry-delay 5 -o "microg-assets/microg-${MICROG_VERSION}-noicon-armeabi-v7a.apk" \
            "$BASE/microg-${MICROG_VERSION}-noicon-armeabi-v7a.apk"
          echo "$MICROG_ARM64_SHA256  microg-assets/microg-${MICROG_VERSION}-noicon-arm64-v8a.apk" | sha256sum -c -
          echo "$MICROG_V7_SHA256  microg-assets/microg-${MICROG_VERSION}-noicon-armeabi-v7a.apk" | sha256sum -c -
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          for apk in microg-assets/*.apk; do
            "$BT/apksigner" verify --print-certs "$apk" > "microg-assets/$(basename "$apk").certs"
            grep -qi "$MICROG_CERT_SHA256" "microg-assets/$(basename "$apk").certs"
          done
          ls -lh microg-assets

      - name: Decode stable v1.0.1
        run: java -Xmx6g -jar apktool.jar d -f base.apk -o work

      - name: Apply Zversion and one-app patches
        run: |
          python3 scripts/apply-zversion.py work
          python3 scripts/apply-one-app.py work microg-assets

      - name: Compile one-app setup dex
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          PLATFORM="$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -n1)"
          echo "Using $BT and $PLATFORM"
          mkdir -p build/setup-classes build/setup-dex
          javac --release 8 -encoding UTF-8 -Xlint:-options \
            -classpath "$PLATFORM/android.jar" \
            -d build/setup-classes \
            $(find setup-src -name '*.java')
          "$BT/d8" --min-api 29 --lib "$PLATFORM/android.jar" \
            --output build/setup-dex \
            $(find build/setup-classes -name '*.class')
          test -f build/setup-dex/classes.dex

      - name: Static acceptance tests (pre-build)
        run: |
          python3 ci/test-one-app.py --work work --dex build/setup-dex/classes.dex

      - name: Rebuild APK
        run: |
          mkdir -p dist
          java -Xmx6g -jar apktool.jar b work -o dist/unsigned.apk

      - name: Add classes11.dex to the APK
        run: |
          cp build/setup-dex/classes.dex dist/classes11.dex
          (cd dist && zip -j -0 unsigned.apk classes11.dex)
          unzip -l dist/unsigned.apk | grep -E 'classes11\.dex$'

      - name: Zipalign
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "BUILD_TOOLS=$BT" >> "$GITHUB_ENV"
          echo "Using $BT"
          "$BT/zipalign" -p -f 4 dist/unsigned.apk dist/aligned.apk

      - name: Fetch AOSP testkey and verify certificate fingerprint
        run: |
          base="https://android.googlesource.com/platform/build/+/refs/heads/master/target/product/security"
          curl -fsSL "$base/testkey.pk8?format=TEXT" | base64 -d > testkey.pk8
          curl -fsSL "$base/testkey.x509.pem?format=TEXT" | base64 -d > testkey.x509.pem
          FP="$(openssl x509 -in testkey.x509.pem -noout -fingerprint -sha256 \
                | sed 's/^.*=//' | tr -d ':' | tr 'A-F' 'a-f')"
          echo "cert sha256: $FP"
          test "$FP" = "$CERT_SHA256"

      - name: Sign with AOSP testkey (same signature as v1.0.1)
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --key testkey.pk8 --cert testkey.x509.pem \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out dist/T-YouTube-Zversion.apk dist/aligned.apk

      - name: Verify APK
        run: |
          "$BUILD_TOOLS/apksigner" verify --print-certs dist/T-YouTube-Zversion.apk | tee dist/verify.txt
          grep -qi "$CERT_SHA256" dist/verify.txt

          "$BUILD_TOOLS/aapt2" dump badging dist/T-YouTube-Zversion.apk | head -n1 | tee dist/badging.txt
          grep -q "package: name='com.gold.android.youtube' versionCode='2147483647'" dist/badging.txt
          grep -q "versionName='21.26.364'" dist/badging.txt

          DEX_COUNT="$(unzip -l dist/T-YouTube-Zversion.apk | grep -Ec 'classes[0-9]*\.dex$')"
          echo "dex files: $DEX_COUNT"
          test "$DEX_COUNT" -eq 11

          # One-app setup: manifest, assets, settings row, no-op extension.
          grep -q 'REQUEST_INSTALL_PACKAGES' work/AndroidManifest.xml
          grep -q 'REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' work/AndroidManifest.xml
          grep -q 'android:targetActivity="com.gold.youtube.MicroG.MicroGActivity"' work/AndroidManifest.xml
          grep -q 'com.gold.youtube.MicroG.InstallResultReceiver' work/AndroidManifest.xml
          grep -q 'android:key="tyt_setup_preferences"' work/res/xml/youtube_prefs.xml
          test -f work/assets/microg/microg-${MICROG_VERSION}-noicon-arm64-v8a.apk
          test -f work/assets/microg/microg-${MICROG_VERSION}-noicon-armeabi-v7a.apk
          unzip -l dist/T-YouTube-Zversion.apk | grep -q 'assets/microg/microg-.*-noicon-arm64-v8a.apk'
          unzip -p dist/T-YouTube-Zversion.apk classes10.dex | grep -a -q "ZVersionReelBackView"
          # Prove the v1.1.0 features made it into the APK.
          grep -q "ZVersionReelBackView" work/res/layout/reel_player_static_header.xml
          # Root-cause fix: the SECOND same-id back button must carry the loop
          # too, and no plain arrow may remain anywhere in Shorts.
          grep -q "ZVersionReelBackView" work/res/layout/reel_player_back_button.xml
          test "$(grep -rl "reel_back_button" work/res/layout*/ | xargs grep -l "ZVersionReelBackView" | wc -l)" -eq 2
          test "$(grep -rl "reel_back_button" work/res/layout*/ | xargs grep -l "quantum_ic_arrow_back_white_24" | wc -l)" -eq 0
          grep -q "ZVersionWatermark" work/res/layout/youtube_controls_bottom_ui_container.xml
          grep -q "ZVersionWatermark" work/res/layout/youtube_video_exploder_controls_bottom_ui_container.xml
          # Watermark must sit below the scrubber line and be small.
          grep -q 'layout_constraintBottom_toBottomOf="parent"' work/res/layout/youtube_controls_bottom_ui_container.xml
          grep -q 'android:textSize="11.5sp"' work/res/layout/youtube_controls_bottom_ui_container.xml
          grep -q 'android:alpha="0.55"' work/res/layout/youtube_controls_bottom_ui_container.xml
          test -f work/res/drawable/tyt_reel_back_animation.xml
          test ! -e work/res/drawable/tyt_reel_back_foreground.xml
          test "$(find work/res/drawable-xxhdpi -name 'tyt_brand_*.png' | wc -l)" -eq 8
          # Download: original v1.0.1 state machine + two surgical auto-rename
          # blocks + the cancel-only info dialog. Count inside the method only -
          # the untouched lambda$checkSelectedDownload$9 also calls
          # createUniqueFile, so a whole-file count would be wrong.
          awk '/^\.method private checkSelectedDownload\(/,/^\.end method/' \
            work/smali_classes10/com/gold/youtube/om7753/download/DownloadDialog.smali \
            > /tmp/check_method.smali
          test "$(grep -c 'createUniqueFile' /tmp/check_method.smali)" -eq 2
          test "$(grep -c 'goto :info_dialog' /tmp/check_method.smali)" -eq 2
          grep -q 'try_start_u1' /tmp/check_method.smali
          grep -q 'try_start_u2' /tmp/check_method.smali
          grep -q ':info_dialog' /tmp/check_method.smali
          grep -q 'continueSelectedDownload' /tmp/check_method.smali
          # the restored state machine must still read the mission state
          grep -q 'checkForExistingMission' /tmp/check_method.smali
          rm -f /tmp/check_method.smali
          test ! -e work/smali_classes10/com/gold/youtube/om7753/download/ZVersionDownloadUniqueAction.smali
          grep -q 'if-eqz p1, :cond_0' work/smali_classes10/com/gold/youtube/om7753/util/FilenameUtils.smali
          grep -q 'if-nez v0, :done' work/smali_classes10/com/gold/extension/youtube/brand/ZVersionReelBackView.smali
          test "$(grep -c 'if-nez v0, :draw' work/smali_classes10/com/gold/extension/youtube/brand/ZVersionReelBackView.smali)" -eq 2
          grep -q 'onWindowFocusChanged(Z)V' work/smali_classes10/com/gold/extension/youtube/brand/ZVersionReelBackView.smali
          grep -q 'if-nez v0, :done' work/smali_classes10/com/gold/extension/youtube/brand/ZVersionWatermark.smali
          grep -q 'onVisibilityChanged(Landroid/view/View;I)V' work/smali_classes10/com/gold/extension/youtube/brand/ZVersionWatermark.smali
          grep -q "21.26.364 (v1.2.0)" work/res/xml/youtube_prefs.xml
          unzip -p dist/T-YouTube-Zversion.apk classes10.dex | grep -a -q "ZVersionReelBackView"

          python3 ci/test-one-app.py --work work --dex build/setup-dex/classes.dex \
            --apk dist/T-YouTube-Zversion.apk

          SIZE="$(stat -c%s dist/T-YouTube-Zversion.apk)"
          SHA="$(sha256sum dist/T-YouTube-Zversion.apk | cut -d' ' -f1)"
          sed -i "s/^APK size: .*/APK size: $SIZE bytes/; s/^SHA-256: .*/SHA-256: $SHA/" ci/TEST-BUILD-README.txt
          cp ci/TEST-BUILD-README.txt dist/T-YouTube-Zversion-TEST-README.txt
          echo "size: $SIZE bytes"
          echo "sha256: $SHA"
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: T-YouTube-Zversion-${{ github.sha }}
          path: |
            dist/T-YouTube-Zversion.apk
            dist/T-YouTube-Zversion-TEST-README.txt
            dist/verify.txt
            dist/badging.txt
          compression-level: 0
          retention-days: 14

      - name: Publish prerelease (tag builds only)
        if: startsWith(github.ref, 'refs/tags/test-zversion-') || startsWith(github.ref, 'refs/tags/test-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/T-YouTube-Zversion.apk \
              dist/T-YouTube-Zversion-TEST-README.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "T YouTube test build $GITHUB_REF_NAME" \
              --notes "v1.2.0 one-app setup test build, built from stable v1.0.1 at commit $GITHUB_SHA. One visible app: the launcher now opens a short setup screen that installs the official MicroG-RE 7.3.0 -noicon APK already bundled inside T YouTube. No separate download, no second icon. Two packages are installed; microG's icon is hidden, and Settings > Setup & permissions reopens the checklist later. Adds install-unknown-apps and battery-exemption prompts, keeps the existing microG settings row, and makes the extension's old checkGmsCore a no-op so it cannot open a browser behind setup. Issue #2: the fullscreen watermark is now 11.5sp at 0.55 alpha. Package, version code and AOSP testkey signature are unchanged, so it installs over v1.1.0 with data intact. See T-YouTube-Zversion-TEST-README.txt for the device checklist." \
              --prerelease \
              dist/T-YouTube-Zversion.apk \
              dist/T-YouTube-Zversion-TEST-README.txt
          fi
