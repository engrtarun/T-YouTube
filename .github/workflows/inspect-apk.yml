name: Inspect base APK

# Read-only reconnaissance for APK work. Decodes the pinned base APK on a
# GitHub runner (never on the maintainer's machine), greps the pieces we need
# for manifest/smali patches, and commits the report to the ci-results branch.
on:
  workflow_dispatch:
  push:
    branches:
      - ci/inspect

permissions:
  contents: write

concurrency:
  group: inspect-base-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_APK_URL: https://github.com/engrtarun/T-YouTube/releases/download/v1.0.1/T-YouTube-v1.0.1.apk
  BASE_APK_SHA256: 71b0f782702129a0ddcc80ee0a7150f52fe0099671ab62692766b1c605ebe7fe
  APKTOOL_VERSION: 2.11.1

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download base APK and verify checksum
        run: |
          curl -fL --retry 3 --retry-delay 5 -o base.apk "$BASE_APK_URL"
          echo "$BASE_APK_SHA256  base.apk" | sha256sum -c -

      - name: Download apktool
        run: |
          curl -fL --retry 3 -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

      - name: Decode base APK
        run: java -Xmx6g -jar apktool.jar d -f base.apk -o work

      - name: Inspect decoded tree
        env:
          BASE_APK_SHA256: ${{ env.BASE_APK_SHA256 }}
          APKTOOL_VERSION: ${{ env.APKTOOL_VERSION }}
        run: bash ci/inspect-apk.sh work ci/results

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-apk-inspection-${{ github.sha }}
          path: ci/results/
          retention-days: 14

      - name: Publish report to ci-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-results
          git add -f ci/results
          git commit -m "ci: base APK inspection $(date -u +%FT%TZ)"
          git push -f origin ci-results
